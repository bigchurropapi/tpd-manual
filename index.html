<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TPD Manual — Field Reference</title>
<meta name="description" content="Toledo Police Department Standard Operating Guidelines, organized for reading and searching on a phone.">
<meta name="theme-color" content="#101828" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Operation: Disappointments">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="icon" href="favicon.png?v=2" type="image/png">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=erode@600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar" id="topbar">
  <div class="topbar-inner">
    <button class="icon-btn" id="btn-back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <a class="brand" href="#/" id="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text"><strong>TPD Manual</strong><small id="brand-sub">October 2026 edition</small></span>
    </a>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-search" aria-label="Search">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="btn-theme" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<div id="loading" class="loading">
  <div class="loading-card">
    <span class="brand-mark big" aria-hidden="true"></span>
    <p>Loading the manual…</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
